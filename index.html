header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:15px 18px;box-shadow:0 4px 25px rgba(0,0,0,.3)}

.row.status-absent{border-color:rgba(255,85,115,.65);background:linear-gradient(145deg,rgba(83,27,43,.92),rgba(34,10,20,.96))}

.row.status-absent .semester{background:rgba(255,85,115,.14);border-color:rgba(255,85,115,.35);color:#ffb3c0}
.row.status-completed .details,.row.status-absent .details{border-top-color:rgba(255,255,255,.12)}

button{font-family:inherit;border:0;border-radius:9px;padding:9px 11px;font-weight:700;cursor:pointer}.call{background:rgba(37,215,123,.12);border:1px solid rgba(37,215,123,.25);color:#57e89a;text-decoration:none;padding:8px 10px;border-radius:9px;font-weight:800}.done{background:rgba(37,215,123,.12);color:#54e79a;border:1px solid rgba(37,215,123,.28)}.absent{background:rgba(255,85,115,.11);color:#ff718b;border:1px solid rgba(255,85,115,.25)}.done.active{background:#25d77b;color:#03150c}.absent.active{background:#ff5573;color:#19040a}.reset{background:#172236;color:#c9d4e8;border:1px solid var(--line)}
